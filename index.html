<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#252525">
<meta name="description" content="锦绣芳楼访问导航">
<title>锦绣芳楼 · 访问导航</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #252525;
    color: #292929;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    min-height: 100vh;
    padding: 36px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.layout {
    width: 100%;
    max-width: 920px;
    min-height: 510px;
    display: grid;
    grid-template-columns: 34% 66%;
    background: #f0efe9;
    overflow: hidden;
}

/* 左侧品牌区域 */
.brand {
    background: #383838;
    color: #f4f1e9;
    padding: 38px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.brand-top {
    font-size: 11px;
    letter-spacing: 3px;
    color: #aaa9a2;
}

.brand-mark {
    width: 64px;
    height: 64px;
    border: 1px solid #a9a18e;
    display: grid;
    place-items: center;
    font-size: 29px;
    margin-bottom: 26px;
    color: #d5c8a9;
}

.brand h1 {
    font-size: 30px;
    line-height: 1.5;
    letter-spacing: 3px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.brand-en {
    margin-top: 12px;
    color: #aaa9a2;
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 1.8;
}

.brand-bottom {
    border-top: 1px solid #555;
    padding-top: 18px;
    color: #aaa9a2;
    font-size: 12px;
    line-height: 2;
}

/* 右侧内容区域 */
.content {
    padding: 38px 40px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 1px solid #d5d3cb;
    color: #77766f;
    font-size: 11px;
    letter-spacing: 1px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
}

.dot {
    width: 6px;
    height: 6px;
    background: #8a927b;
    border-radius: 50%;
}

.intro {
    padding: 34px 0 25px;
}

.intro h2 {
    font-size: 23px;
    font-weight: 600;
    margin-bottom: 12px;
}

.intro p {
    font-size: 13px;
    color: #77766f;
    line-height: 2;
}

.notice {
    background: #e6e4dc;
    padding: 15px 17px;
    font-size: 12px;
    color: #68675f;
    line-height: 1.9;
    border-left: 2px solid #8d887a;
    margin-bottom: 30px;
}

.section-label {
    font-size: 11px;
    color: #89877e;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 19px 0;
    border-bottom: 1px solid #d5d3cb;
    text-decoration: none;
    color: #30302d;
    transition: padding .2s, color .2s;
}

.entry:hover {
    padding-left: 8px;
    color: #77766f;
}

.entry-info {
    min-width: 0;
}

.entry-name {
    font-size: 15px;
    font-weight: 600;
}

.entry-url {
    font-size: 12px;
    color: #88867d;
    margin-top: 7px;
    overflow-wrap: anywhere;
}

.entry-arrow {
    font-size: 20px;
    color: #77766f;
}

.footer {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 34px;
    font-size: 10px;
    color: #99978e;
    letter-spacing: 1px;
}

/* 手机适配 */
@media (max-width: 650px) {
    body {
        padding: 16px;
        align-items: flex-start;
    }

    .layout {
        grid-template-columns: 1fr;
        margin: 10px auto;
    }

    .brand {
        min-height: 220px;
        padding: 25px;
    }

    .brand-mark {
        width: 48px;
        height: 48px;
        font-size: 23px;
        margin-bottom: 12px;
    }

    .brand h1 {
        font-size: 26px;
    }

    .brand-bottom {
        margin-top: 24px;
    }

    .content {
        padding: 26px 24px;
    }

    .intro {
        padding-top: 28px;
    }
}
</style>
</head>

<body>

<main class="layout">

    <!-- 左侧品牌区 -->
    <aside class="brand">
        <div class="brand-top">WELCOME / 入口导航</div>

        <div>
            <div class="brand-mark">锦</div>
            <h1>锦绣芳楼</h1>
            <div class="brand-en">
                JIN XIU FANG LOU<br>
                SIMPLE ACCESS PORTAL
            </div>
        </div>

        <div class="brand-bottom">
            简约 · 清晰 · 便捷<br>
            收藏本站，方便下次访问
        </div>
    </aside>

    <!-- 右侧内容区 -->
    <section class="content">

        <div class="topbar">
            <span>网站导航</span>
            <span class="status">
                <span class="dot"></span>
                入口页面
            </span>
        </div>

        <div class="intro">
            <h2>欢迎来到锦绣芳楼</h2>
            <p>
                这里是锦绣芳楼访问导航。<br>
                选择下方入口即可继续访问。
            </p>
        </div>

        <div class="notice">
            <strong>温馨提示</strong><br>
            建议收藏本页面，以便后续查找入口。
            如遇链接无法访问，请尝试备用地址。
        </div>

        <div class="section-label">
            ACCESS LINKS / 访问入口
        </div>

        <a class="entry"
           href="https://jinxiu39.top"
           target="_blank"
           rel="noopener noreferrer">
            <div class="entry-info">
                <div class="entry-name">最新地址</div>
                <div class="entry-url">jinxiu39.top</div>
            </div>
            <span class="entry-arrow">↗</span>
        </a>

        <a class="entry"
           href="https://jinxiufang39.com"
           target="_blank"
           rel="noopener noreferrer">
            <div class="entry-info">
                <div class="entry-name">海外永久地址</div>
                <div class="entry-url">jinxiufang39.com</div>
            </div>
            <span class="entry-arrow">↗</span>
        </a>

        <div class="footer">
            <span>© 2026 锦绣芳楼</span>
            <span>ALL RIGHTS RESERVED</span>
        </div>

    </section>

</main>

</body>
</html>
